<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span class="brand">Time Tracker</span>
    <span id="user" class="muted"></span>
  </header>

  <section id="running" class="stopwatch" hidden>
    <div class="dial">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ticks" cx="60" cy="60" r="54" pathLength="60"></circle>
        <circle id="run-sweep" class="sweep" cx="60" cy="60" r="54" pathLength="60"></circle>
      </svg>
      <div id="run-timer" class="timer numerals" role="timer" aria-live="off">0:00:00</div>
    </div>
    <div id="run-title" class="run-title"></div>
    <div id="run-project" class="muted"></div>
    <div class="row">
      <button id="btn-pause" class="primary">Пауза</button>
      <button id="btn-finish">Завершить</button>
    </div>
  </section>

  <section id="finish-panel" class="finish" hidden>
    <h2 class="heading">Задача завершена</h2>
    <div id="finish-title" class="run-title"></div>
    <div id="finish-tracked" class="muted"></div>
    <form id="finish-form" class="finish-form" novalidate>
      <fieldset class="public-time">
        <legend>Публичное время</legend>
        <div class="public-fields">
          <input type="number" id="finish-hours" min="0" step="1" inputmode="numeric" aria-label="Часы">
          <span class="muted">ч</span>
          <input type="number" id="finish-minutes" min="0" max="59" step="1" inputmode="numeric" aria-label="Минуты">
          <span class="muted">мин</span>
        </div>
      </fieldset>
      <p class="muted hint">Попадёт в CSV вместо фактического. Оставьте пустым, чтобы выгружалось фактическое.</p>
      <p id="finish-error" class="error" role="alert"></p>
      <div class="row">
        <button type="submit" class="primary">Сохранить</button>
        <button type="button" id="finish-skip">Пропустить</button>
      </div>
    </form>
  </section>

  <section id="paused-section" class="paused" hidden>
    <h2 class="heading">На паузе</h2>
    <ul id="paused-list"></ul>
  </section>

  <button id="show-form" class="show-form" hidden>Начать другую задачу</button>

  <form id="new-form" class="new-task">
    <h2 class="heading">Новая задача</h2>
    <input id="f-title" placeholder="Что делаете?" aria-label="Название" required maxlength="200" autocomplete="off">
    <textarea id="f-desc" placeholder="Описание, если нужно" aria-label="Описание" rows="2"></textarea>
    <input id="f-project" list="projects" placeholder="Проект" aria-label="Проект" maxlength="100" autocomplete="off">
    <datalist id="projects"></datalist>
    <p id="form-error" class="error" role="alert"></p>
    <button type="submit" class="primary">Запустить таймер</button>
  </form>

  <footer>
    <a href="#" id="open-log">Открыть журнал</a>
    <a href="#" id="add-manual">Добавить запись вручную</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
